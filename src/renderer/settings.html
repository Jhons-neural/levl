<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:">
<title>Levl · Configurações</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="titlebar">
    <img src="../../assets/levl.svg" alt="" width="18" height="18">
    <span>Levl · Configurações</span>
    <button id="close" class="x" aria-label="Fechar"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
  </div>
  <main class="rise">
    <section>
      <h2>Visual</h2>
      <div class="looks" role="radiogroup" aria-label="Visual">
        <button role="radio" data-look="linha" class="look look-linha"><span class="tube h"><span class="bulb"></span><span class="glass"><span class="fill"></span></span></span><span class="name">Linha</span></button>
        <button role="radio" data-look="grafite" class="look look-grafite"><span class="tube h"><span class="bulb"></span><span class="glass"><span class="fill"></span><span class="shine"></span></span></span><span class="name">Grafite</span></button>
        <button role="radio" data-look="nevoa" class="look look-nevoa"><span class="tube h"><span class="bulb"></span><span class="glass"><span class="fill"></span><span class="shine"></span></span></span><span class="name">Névoa</span></button>
      </div>
      <label class="row"><span>Transparência</span><input type="range" id="opacity" min="30" max="100" step="5"><output id="opacityOut" class="mono"></output></label>
      <label class="row"><span>Tamanho</span><input type="range" id="length" min="60" max="420" step="10"><output id="lengthOut" class="mono"></output></label>
      <label class="row"><span>Mostrar porcentagem</span><input type="checkbox" id="showLabel" class="sw"></label>
    </section>
    <section>
      <h2>Comportamento</h2>
      <label class="row"><span>Sempre por cima das janelas</span><input type="checkbox" id="onTop" class="sw"></label>
      <label class="row"><span>Clique atravessa</span><input type="checkbox" id="clickThrough" class="sw"></label>
      <label class="row"><span>Travar posição</span><input type="checkbox" id="locked" class="sw"></label>
      <label class="row"><span>Iniciar com o Windows</span><input type="checkbox" id="autostart" class="sw"></label>
    </section>
    <section>
      <h2>Avisos</h2>
      <label class="row"><span>Avisar com 20%</span><input type="checkbox" id="alertLow" class="sw"></label>
      <label class="row"><span>Avisar quando voltar</span><input type="checkbox" id="alertRefill" class="sw"></label>
      <label class="row"><span>Resumo diário</span><select id="digestHour" class="sel mono" aria-label="Horário do resumo"></select><input type="checkbox" id="digest" class="sw"></label>
      <label class="row"><span>Avisar ritmo acima de +30%</span><input type="checkbox" id="paceAlert" class="sw"></label>
    </section>
    <section>
      <h2>Leitor</h2>
      <label class="row"><span>Modelo da análise</span><select id="analysisModel" class="sel"><option value="sonnet">Sonnet (mais barato)</option><option value="opus">Opus (mais profundo)</option></select></label>
    </section>
    <section>
      <h2>Atalhos</h2>
      <label class="row"><span>Atalho mostrar/ocultar</span><input id="hotkey" class="key mono" readonly><small class="err" id="hotkeyErr"></small></label>
      <label class="row"><span>Atalho clique atravessa</span><input id="clickHotkey" class="key mono" readonly><small class="err" id="clickHotkeyErr"></small></label>
    </section>
    <section class="last">
      <div class="row"><button id="check" class="btn lens">Procurar atualização</button><small id="checkOut" class="soft"></small></div>
    </section>
  </main>
  <footer class="soft mono" id="about"></footer>
  <script type="module" src="settings.js"></script>
</body>
</html>
